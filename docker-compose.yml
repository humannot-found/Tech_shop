name: tech-shop-system

x-backend-env: &backend-env
  TECH_SHOP_ENVIRONMENT: ${TECH_SHOP_ENVIRONMENT:-development}
  TECH_SHOP_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tech_shop_system}
  TECH_SHOP_JWT_SECRET_KEY: ${TECH_SHOP_JWT_SECRET_KEY:-development-only-change-me-change-before-production}
  TECH_SHOP_JWT_ALGORITHM: ${TECH_SHOP_JWT_ALGORITHM:-HS256}
  TECH_SHOP_ACCESS_TOKEN_MINUTES: ${TECH_SHOP_ACCESS_TOKEN_MINUTES:-60}
  TECH_SHOP_REFRESH_TOKEN_DAYS: ${TECH_SHOP_REFRESH_TOKEN_DAYS:-7}
  TECH_SHOP_CORS_ORIGINS: ${TECH_SHOP_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000}
  TECH_SHOP_MPESA_ENVIRONMENT: ${TECH_SHOP_MPESA_ENVIRONMENT:-sandbox}
  TECH_SHOP_MPESA_CONSUMER_KEY: ${TECH_SHOP_MPESA_CONSUMER_KEY:-}
  TECH_SHOP_MPESA_CONSUMER_SECRET: ${TECH_SHOP_MPESA_CONSUMER_SECRET:-}
  TECH_SHOP_MPESA_PASSKEY: ${TECH_SHOP_MPESA_PASSKEY:-}
  TECH_SHOP_MPESA_SHORTCODE: ${TECH_SHOP_MPESA_SHORTCODE:-174379}
  TECH_SHOP_MPESA_TRANSACTION_TYPE: ${TECH_SHOP_MPESA_TRANSACTION_TYPE:-CustomerPayBillOnline}
  TECH_SHOP_MPESA_CALLBACK_BASE_URL: ${TECH_SHOP_MPESA_CALLBACK_BASE_URL:-http://localhost:8000}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tech_shop_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tech_shop_system}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  admin_frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${ADMIN_VITE_API_BASE_URL:-http://localhost:8000/api/v1/staff}
      VITE_BRAND_NAME: ${VITE_BRAND_NAME:-Crystal-shop}
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "${ADMIN_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  website:
    build:
      context: ./vue_file/crystal-tech-shop
      target: development
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${WEBSITE_VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "5174"]
    ports:
      - "${WEBSITE_PORT:-5174}:5174"
    volumes:
      - ./vue_file/crystal-tech-shop:/app
      - website_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      <<: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  seed_access:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      <<: *backend-env
    command: ["python", "-m", "backend.cli.seed_access"]
    depends_on:
      postgres:
        condition: service_healthy

  seed_demo:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      <<: *backend-env
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-DemoPass123!}
    command: >
      sh -c "alembic upgrade head &&
             python -m backend.cli.seed_demo --password \"$${DEMO_SEED_PASSWORD}\""
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  admin_node_modules:
  website_node_modules:
